apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-api
  namespace: inventory

spec:
  replicas: 1

  selector:
    matchLabels:
      app: inventory-api

  template:
    metadata:
      labels:
        app: inventory-api

    spec:
      containers:
        - name: inventory-api
          image: inventory-alert-api:0.1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          envFrom:
            - configMapRef:
                name: inventory-config

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
