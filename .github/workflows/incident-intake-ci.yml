name: Incident Intake CI

on:
  pull_request:
    paths:
      - "project-04-incident-intake/**"
      - ".github/workflows/incident-intake-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: project-04-incident-intake

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

  terraform-checks:
    name: Terraform checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: project-04-incident-intake

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Detect Terraform configuration
        id: detect
        run: |
          if find . -name '*.tf' -print -quit | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Terraform not yet implemented."
          fi

      - name: Check formatting
        if: steps.detect.outputs.exists == 'true'
        run: terraform fmt -check -recursive

      - name: Initialise without remote backend
        if: steps.detect.outputs.exists == 'true'
        run: terraform init -backend=false -input=false

      - name: Validate
        if: steps.detect.outputs.exists == 'true'
        run: terraform validate

      - name: Install Checkov
        if: steps.detect.outputs.exists == 'true'
        run: python -m pip install checkov

      - name: Security scan
        if: steps.detect.outputs.exists == 'true'
        run: checkov -d . --framework terraform
        
        terraform-plan:
    name: Reviewed Terraform plan
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    environment: infrastructure-plan

    defaults:
      run:
        working-directory: project-04-incident-intake

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Initialise Terraform
        run: terraform init -input=false

      - name: Generate plan
        run: |
          terraform plan \
            -input=false \
            -out=tfplan

      - name: Display plan
        run: terraform show -no-color tfplan

      - name: Save plan summary
        run: |
          terraform show -no-color tfplan \
            > terraform-plan.txt

      - name: Upload plan summary
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-summary
          path: project-04-incident-intake/terraform-plan.txt
          retention-days: 7
